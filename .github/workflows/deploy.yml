name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - run: bun install
      - run: bun run build
        env:
          BASE_PATH: /${{ github.event.repository.name }}/
      - name: Locate static output
        run: |
          DIR=$(dirname "$(find dist .output -name index.html -path '*public*' -o -name index.html -path '*client*' | head -n1)")
          echo "Static dir: $DIR"
          touch "$DIR/.nojekyll"
          echo "STATIC_DIR=$DIR" >> $GITHUB_ENV
      - uses: actions/upload-pages-artifact@v3
        with:
          path: ${{ env.STATIC_DIR }}
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
